name: Build, Push & Deploy (Phinance-AI)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            dhxruv/phinance-ai:v2.0
            dhxruv/phinance-ai:latest
          cache-from: type=registry,ref=dhxruv/phinance-ai:latest
          cache-to: type=inline

  deploy-ec2:
    name: Deploy to EC2
    needs: build-and-push   
    runs-on: ubuntu-latest

    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            cd phinance-ai

            docker-compose down

            docker image prune -af || true

            docker-compose pull
            docker-compose up -d

            sleep 25
            curl http://localhost:5001/ || true
            curl http://localhost:5001/analyze || true

            curl --fail http://localhost:5001/api/health
            
