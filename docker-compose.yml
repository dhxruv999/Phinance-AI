version: "3.8"
services:
  web:
    build: .
    # Optional: set 'image' to your Docker Hub repo to push directly (e.g. USERNAME/phishing-detector:latest)
    # image: USERNAME/phishing-detector:latest
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
    # Models are baked into the image; no runtime mounts required
    restart: unless-stopped
